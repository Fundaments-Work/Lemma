name: Notify Docs Portal

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'DESIGN.md'
      - 'CHANGELOG.md'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs-updated to fundaments-landing
        env:
          GH_TOKEN: ${{ secrets.STUDIO_SYNC_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::STUDIO_SYNC_TOKEN is not set; skipping docs portal dispatch."
            exit 0
          fi
          echo "Dispatching docs-updated event to Fundaments-Work/fundaments-landing..."
          gh api repos/Fundaments-Work/fundaments-landing/dispatches \
            -f event_type=docs-updated \
            -F "client_payload[product]=lemma" \
            -F "client_payload[ref]=${{ github.ref_name }}" \
            -F "client_payload[sha]=${{ github.sha }}" || echo "Failed to dispatch to fundaments-landing"

      - name: Rebuild the product site
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}
        run: |
          # The product site reads the current release version from GitHub at build
          # time, so a new release needs a rebuild even when no site file changed.
          if [ -n "$DEPLOY_HOOK" ]; then
            echo "Triggering Cloudflare Pages deploy hook..."
            curl -fsS -X POST "$DEPLOY_HOOK"
          else
            echo "::notice::CLOUDFLARE_DEPLOY_HOOK_URL is not set; the product site will not rebuild on this event."
          fi
